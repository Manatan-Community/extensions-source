[package]
name = "mangaup"
version = "0.1.0"
edition = "2024"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aes = "0.8"
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc"] }
manatan-extension = { git = "https://github.com/KolbyML/manatan-rs", default-features = false }
prost = "0.14"
serde_json = "1"
