[package]
name = "theblank"
version = "0.1.0"
edition = "2024"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
chacha20 = { version = "0.10", features = ["xchacha"] }
hmac = "0.12"
manatan-extension = { git = "https://github.com/KolbyML/manatan-rs", default-features = false }
manatan-shared = { path = "../../../shared/manatan-shared" }
poly1305 = "0.8"
rand_core = { version = "0.6", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets"] }
