[workspace]
members = [
  "shared/manatan-shared",
  "tools/xtask"
]
exclude = [
  "manga/*/*",
  "video/*/*",
  "novel/*/*"
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
manatan-extension = { git = "https://github.com/KolbyML/manatan-rs", default-features = false }
