[workspace]
resolver = "2"
members = [
    "manga/*/*",
    "video/*/*",
    "novel/*/*",
    "shared/*",
    "tools/xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Manatan-Community/extensions-source"

[workspace.dependencies]
anyhow = "1"
manatan-sdk = "=1.0.0"
manatan-common = { path = "shared/manatan-common" }
anikoto-theme = { path = "shared/anikoto-theme" }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
ed25519-dalek = "2"
hex = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
regex = "1"
scraper = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
toml = "0.8"
url = "2.5"
walkdir = "2"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
