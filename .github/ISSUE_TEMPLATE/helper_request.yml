name: Helper/library request
description: Request shared helper support.
body:
  - type: dropdown
    id: media
    attributes:
      label: Media kind
      options: [manga, video, novel, shared]
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: Helper request
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Upstream behavior and capability gap
      description: Include source paths, request flow, and why existing typed APIs or generic dispatch are insufficient.
    validations:
      required: true
