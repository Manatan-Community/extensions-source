name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo fmt --check
      - run: cargo check
      - run: cargo test
      - run: cargo run -p xtask -- validate
      - run: cargo run -p xtask -- test-examples
      - run: cargo run -p xtask -- build-all
      - run: cargo run -p xtask -- generate-index
      - run: cargo run -p xtask -- validate-packages
      - run: cargo run -p xtask -- smoke-test
      - name: Ensure generated indexes are current
        run: git diff --exit-code -- dist
      - uses: actions/upload-artifact@v4
        with:
          name: manatan-example-packages
          path: dist/**/*.manatan
