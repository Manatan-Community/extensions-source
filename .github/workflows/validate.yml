name: Validate components

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@wasm-tools
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace
      - run: cargo run -p xtask -- validate
      # Pull requests compile untrusted guest sources without access to the
      # repository publisher key. Signed packages are produced only by a
      # protected release workflow after review.
      - run: cargo run -p xtask -- build-components
      - uses: actions/upload-artifact@v4
        with:
          name: manatan2-components
          path: target/manatan2-components/*.wasm
